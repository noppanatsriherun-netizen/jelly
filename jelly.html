<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Secret For Jelly</title>

<style>

body{
margin:0;
background:radial-gradient(circle at center,#1a0033,#000);
color:white;
font-family:monospace;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

/* galaxy */

.galaxy{
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#ff4da6,transparent);
border-radius:50%;
animation:spin 40s linear infinite;
opacity:0.25;
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

/* stars */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2}
to{opacity:1}
}

/* container */

.container{
z-index:2;
}

/* typing text */

#text{
font-size:28px;
margin-bottom:25px;
min-height:70px;
}

/* jelly text */

#heart{
font-size:90px;
display:none;
color:#ff4da6;
text-shadow:
0 0 10px #ff4da6,
0 0 20px #ff4da6,
0 0 40px #ff4da6;
animation:pop 1.5s forwards;
}

@keyframes pop{
0%{transform:scale(0)}
60%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* button */

button{
margin-top:30px;
padding:14px 30px;
border:none;
border-radius:40px;
background:#ff4da6;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 20px #ff4da6;
}

/* floating hearts */

.heart{
position:absolute;
color:#ff4da6;
animation:float 6s linear infinite;
}

@keyframes float{
from{transform:translateY(100vh) scale(0.5);opacity:1}
to{transform:translateY(-10vh) scale(1.5);opacity:0}
}

/* shooting star */

.shoot{
position:absolute;
width:3px;
height:80px;
background:linear-gradient(white,transparent);
transform:rotate(45deg);
animation:shoot 3s linear infinite;
}

@keyframes shoot{
0%{
top:-10%;
left:10%;
opacity:0;
}
10%{opacity:1;}
100%{
top:110%;
left:90%;
opacity:0;
}
}

</style>
</head>

<body>

<div class="galaxy"></div>
<div class="shoot"></div>

<div class="container">
<div id="text"></div>
<div id="heart">❤️ Jelly ❤️</div>
<button onclick="explode()">Reveal The Secret</button>
</div>

<!-- music -->
<iframe id="music" width="0" height="0" src="" allow="autoplay"></iframe>

<script>

/* typing text */

let message="กำลังค้นหาคนที่ทำให้เจฟยิ้มได้ทุกวัน...\nผลลัพธ์ที่พบคือ...";
let i=0;

function type(){

if(i<message.length){

let char=message.charAt(i)

document.getElementById("text").innerHTML+=
char=="\n"?"<br>":char

i++

setTimeout(type,45)

}else{

setTimeout(()=>{

document.getElementById("heart").style.display="block"

},500)

}

}

type()

/* stars */

for(let i=0;i<160;i++){

let s=document.createElement("div")

s.className="star"

s.style.left=Math.random()*100+"vw"
s.style.top=Math.random()*100+"vh"

document.body.appendChild(s)

}

/* explosion */

function explode(){

document.getElementById("music").src =
"https://www.youtube.com/embed/SYHR25vQicU?autoplay=1&loop=1&playlist=SYHR25vQicU"

alert("คำตอบของหัวใจเจฟคือ Jelly 💖")

for(let i=0;i<120;i++){

let h=document.createElement("div")

h.className="heart"

h.innerHTML="❤️"

h.style.left=Math.random()*100+"vw"

h.style.fontSize=(20+Math.random()*50)+"px"

h.style.animationDuration=(3+Math.random()*3)+"s"

document.body.appendChild(h)

}

}

</script>

</body>
</html>
